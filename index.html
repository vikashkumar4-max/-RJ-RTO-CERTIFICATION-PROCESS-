<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RJ RTO Training Portal - </title>
  <link rel="stylesheet" href="style.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top Official Strip -->
  <div class="gov-top-strip">
    <div class="gov-container strip-content">
      <span class="gov-title-tag"><i data-lucide="shield-check"></i>MRATYUNJAY BRAHMAVANSHI </span>
      <span class="helpline-text"> </span>
    </div>
  </div>

  <!-- Government Main Header -->
  <header class="gov-header">
    <div class="gov-container header-content">
      <div class="gov-brand">
        <div class="gov-logo-box">
          <i data-lucide="building-2"></i>
        </div>
        <div class="gov-brand-titles">
          <h1>सड़क परिवहन एवं राजमार्ग मंत्रालय - आर.टी.ओ. राजस्थान</h1>
          <h2>RJ RTO Device Certification & Verification Training Module</h2>
        </div>
      </div>
      <div class="gov-header-actions">
        <div class="step-indicator-box">
          Step <span id="current-step-num">1</span> of <span id="total-steps-num">10</span>
        </div>
        <button id="toggle-audio-btn" class="gov-btn-audio active">
          <i data-lucide="volume-2"></i>
          <span>Audio Guide On</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Body Layout -->
  <main class="gov-container main-layout">

    <!-- LEFT COLUMN: 3D Voice Avatar -->
    <aside class="left-col">
      <div class="gov-card avatar-card">
        <div class="card-gov-header">
          <i data-lucide="user-check"></i>
          <span>आर.टी.ओ. प्रशिक्षक (Official Trainer)</span>
        </div>

        <div class="avatar-stage">
          <div class="speaker-wave-container" id="speaker-waves">
            <div class="wave wave1"></div>
            <div class="wave wave2"></div>
            <div class="wave wave3"></div>
          </div>

          <div class="avatar-wrapper" id="avatar-wrapper">
            <img id="avatar-img" src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=600&q=80" alt="Govt Trainer Avatar" />
            <div class="avatar-status-badge">
              <span class="status-dot"></span>
              <span id="status-text">Ready to Guide</span>
            </div>
          </div>
        </div>

        <div class="dialogue-box">
          <div class="dialogue-header">
            <i data-lucide="message-square"></i>
            <span>Hindi Voice Instruction</span>
          </div>
          <p id="dialogue-text">Loading instructions...</p>
          <button id="replay-voice-btn" class="gov-btn-speech">
            <i data-lucide="play"></i> Replay Audio
          </button>
        </div>
      </div>
    </aside>

    <!-- RIGHT COLUMN: Instructions Display & Timeline -->
    <section class="right-col">

      <!-- Overall Progress -->
      <div class="gov-card progress-card">
        <div class="progress-title-row">
          <span>Overall SOP Completion Progress</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="progress-bar"></div>
        </div>
      </div>

      <!-- Main Dynamic Content Card -->
      <div class="gov-card content-card" id="step-card-display">
        <!-- Rendered by JS -->
      </div>

      <!-- Bottom Navigation Controls -->
      <footer class="gov-card nav-footer">
        <button id="prev-btn" class="gov-nav-btn" disabled>
          <i data-lucide="arrow-left"></i> Previous Step
        </button>

        <div class="step-dots-timeline" id="step-dots-timeline">
          <!-- Rendered by JS -->
        </div>

        <button id="next-btn" class="gov-nav-btn primary">
          Next Step <i data-lucide="arrow-right"></i>
        </button>
      </footer>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
